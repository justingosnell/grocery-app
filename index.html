<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Build, organize, and save grocery lists in seconds with a fast grocery planning app." />
  <title>Modern Grocery List</title>
  <link rel="stylesheet" href="/src/tailwind.css" />
</head>
<body class="min-h-screen bg-[#F1F7F2] text-[#1F2937]">
  <header class="sticky top-0 z-40 border-b border-[#E5E7EB] bg-white/95 shadow-sm shadow-[#1F2937]/5 backdrop-blur">
    <div class="mx-auto flex max-w-5xl flex-col gap-3 px-4 py-3 sm:px-6">
      <div class="flex items-center justify-between gap-3">
        <div class="flex min-w-0 items-center gap-3">
          <div class="flex h-16 w-16 shrink-0 items-center justify-center overflow-hidden rounded-2xl bg-white shadow-sm shadow-[#1F2937]/10">
            <img src="/grocery-logo.webp" alt="Grocery app logo" class="h-full w-full object-contain" width="64" height="64" />
          </div>
          <div class="min-w-0">
            <div class="truncate text-lg font-semibold text-[#0F5D1D]">Grocery Lists</div>
          </div>
        </div>
        <div class="flex shrink-0 items-center gap-2">
          <button id="authStatusPill" type="button" class="rounded-full border border-[#E5E7EB] bg-[#F1F7F2] px-3 py-1 text-sm font-semibold text-[#2E7D32] transition hover:bg-[#C8E6C9]/35">Sign in</button>
        </div>
      </div>

      <div class="list-name-field relative mx-auto w-full max-w-xl">
        <label for="listNameInput" class="list-name-label">List name</label>
        <input id="listNameInput" type="text" class="grocery-input list-name-input w-full" placeholder="Name this list" autocomplete="off" />
        <div id="storeAutocomplete" class="absolute left-0 right-0 top-full z-50 mt-2 hidden max-h-64 overflow-y-auto rounded-2xl border border-[#E5E7EB] bg-white p-2 text-left shadow-xl shadow-[#1F2937]/10"></div>
      </div>
    </div>
  </header>

  <main class="mx-auto flex min-h-screen max-w-5xl flex-col px-4 pb-28 pt-4 sm:px-6">
    <section class="overflow-hidden rounded-[1.5rem] border border-[#E5E7EB] bg-white shadow-xl shadow-[#1F2937]/8">
      <div class="flex flex-col gap-3 border-b border-[#E5E7EB] bg-[#F1F7F2] px-4 py-3 sm:flex-row sm:items-center sm:justify-between sm:px-6">
        <div class="min-w-0">
          <p class="text-sm font-semibold text-[#1F2937]">Your Basket</p>
          <p class="text-xs text-[#6B7280]">Items are saved locally as you shop.</p>
        </div>
        <form id="quickAddForm" class="grid w-full grid-cols-[1fr_auto] gap-2 sm:max-w-xl">
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-sm" aria-hidden="true">🛒</span>
            <input id="quickAddInput" type="text" class="grocery-input w-full py-3 pl-9" placeholder="What do you need from the store today?" autocomplete="off" />
          </div>
          <button type="submit" class="grocery-primary rounded-2xl px-4 py-3 text-sm font-semibold">Add</button>
        </form>
      </div>
      <div class="p-4 sm:p-6">
        <div class="mb-4 flex flex-col gap-4">
          <div class="grid gap-3 sm:grid-cols-[1fr_11rem]">
            <input id="itemSearchInput" type="search" class="grocery-input w-full" placeholder="Search current list" />
            <label for="categoryFilter" class="sr-only">Filter by category</label>
            <select id="categoryFilter" class="sr-only">
              <option value="all">All categories</option>
            </select>
            <label for="sortSelect" class="sr-only">Sort basket items</label>
            <select id="sortSelect" class="grocery-input">
              <option value="smart">Smart aisles</option>
              <option value="manual">Manual order</option>
              <option value="name">Name</option>
              <option value="category">Category</option>
              <option value="needed">Needed first</option>
              <option value="checked">Checked first</option>
            </select>
          </div>
          <div id="staplesRail" class="flex gap-2 overflow-x-auto pb-1"></div>
        </div>
        <ul id="currentList" class="space-y-3"></ul>
        <div class="mt-5 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <button id="clearListLink" type="button" class="text-sm font-medium text-[#E53935] transition hover:text-[#C62828]">Clear list</button>
          <button id="saveListActionBtn" class="grocery-primary w-full rounded-2xl px-5 py-3 font-semibold sm:w-auto">Create</button>
        </div>
      </div>
    </section>
  </main>

  <div id="savedDrawer" class="fixed inset-0 z-50 hidden">
    <div id="savedDrawerOverlay" class="absolute inset-0 bg-black/60"></div>
    <aside class="absolute right-0 top-0 flex h-full w-full max-w-sm flex-col bg-white p-4 shadow-2xl shadow-[#1F2937]/20">
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-xl font-semibold text-[#1F2937]">Saved lists</h2>
        <button id="closeSavedDrawerBtn" class="rounded-full border border-[#E5E7EB] p-2 text-[#6B7280] transition hover:bg-[#C8E6C9]/35" aria-label="Close saved lists">✕</button>
      </div>
      <input id="savedSearchInput" type="text" class="grocery-input mb-4 w-full" placeholder="Search saved lists..." />
      <div id="savedListsContainer" class="flex-1 space-y-3 overflow-y-auto"></div>
      <div class="mt-4 grid grid-cols-2 gap-3 border-t border-[#E5E7EB] pt-4">
        <button id="exportDataBtn" type="button" class="grocery-secondary rounded-2xl px-4 py-3 font-semibold">Export</button>
        <label class="grocery-secondary cursor-pointer rounded-2xl px-4 py-3 text-center font-semibold">
          Import
          <input id="importDataInput" type="file" accept="application/json" class="hidden" />
        </label>
      </div>
    </aside>
  </div>

  <div class="fixed inset-x-0 bottom-0 z-30 border-t border-[#E5E7EB] bg-white/95 backdrop-blur">
    <div class="mx-auto flex max-w-5xl items-center justify-end px-4 py-3 sm:px-6">
      <button id="bottomSavedListsToggleBtn" class="relative flex h-12 min-w-16 items-center justify-center rounded-2xl border border-[#E5E7EB] bg-[#C8E6C9]/55 px-3 text-sm font-semibold text-[#2E7D32] transition hover:bg-[#66BB6A]/20">Lists</button>
    </div>
  </div>

  <div id="authModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4 backdrop-blur">
    <div class="w-full max-w-md rounded-[1.5rem] border border-[#E5E7EB] bg-white p-6 shadow-2xl shadow-[#1F2937]/20">
      <div class="mb-5 flex items-start justify-between gap-4">
        <div>
          <h3 id="authModalTitle" class="text-xl font-semibold text-[#1F2937]">Sign in</h3>
          <p id="authModalSubtitle" class="mt-1 text-sm text-[#6B7280]">Use your Clerk account.</p>
        </div>
        <button id="closeAuthModalBtn" type="button" class="rounded-full border border-[#E5E7EB] p-2 text-[#6B7280] transition hover:bg-[#C8E6C9]/35" aria-label="Close auth">✕</button>
      </div>
      <form id="authForm" class="space-y-3">
        <input id="authNameInput" type="text" class="grocery-input hidden w-full" placeholder="Name" autocomplete="name" />
        <input id="authEmailInput" type="email" class="grocery-input w-full" placeholder="Email" autocomplete="email" required />
        <input id="authPasswordInput" type="password" minlength="8" class="grocery-input w-full" placeholder="Password" autocomplete="current-password" required />
        <button id="authSubmitBtn" type="submit" class="grocery-primary w-full rounded-2xl px-4 py-3 font-semibold">Sign in</button>
      </form>
      <div id="authClerkMount" class="hidden"></div>
      <div id="accountPanel" class="hidden space-y-4">
        <div class="grocery-mint-surface rounded-2xl p-4">
          <p class="text-xs font-semibold uppercase text-[#2E7D32]">Signed in as</p>
          <p id="accountEmailText" class="mt-1 break-words text-sm font-semibold text-[#1F2937]"></p>
        </div>
        <button id="accountSignOutBtn" type="button" class="grocery-danger w-full rounded-2xl px-4 py-3 font-semibold">Sign out</button>
      </div>
      <button id="authModeToggleBtn" type="button" class="mt-4 w-full text-center text-sm font-medium text-[#2E7D32]">Need an account? Sign up</button>
    </div>
  </div>

  <div id="addItemModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur">
    <div class="mx-4 w-full max-w-md rounded-[1.5rem] border border-[#E5E7EB] bg-white p-6 shadow-2xl shadow-[#1F2937]/20">
      <h3 class="mb-4 text-xl font-semibold text-[#1F2937]">Add New Item</h3>
      <form id="addItemForm">
        <div class="relative">
          <input id="itemInput" type="text" class="grocery-input w-full" placeholder="Item name" autocomplete="off" />
          <div id="itemAutocomplete" class="absolute left-0 right-0 top-full z-50 mt-2 hidden max-h-72 overflow-y-auto rounded-2xl border border-[#E5E7EB] bg-white p-2 shadow-xl shadow-[#1F2937]/10"></div>
        </div>
        <div class="mt-4 grid grid-cols-[6rem_1fr] gap-3">
          <input id="quantityInput" type="number" min="1" value="1" class="grocery-input w-24" />
          <input id="emojiInput" type="text" class="grocery-input flex-1" placeholder="Emoji" />
        </div>
        <div class="mt-4 grid gap-3 sm:grid-cols-2">
          <label for="categoryInput" class="sr-only">Item category</label>
          <select id="categoryInput" class="grocery-input">
            <option value="Produce">Produce</option>
            <option value="Dairy">Dairy</option>
            <option value="Meat">Meat</option>
            <option value="Bakery">Bakery</option>
            <option value="Seafood">Seafood</option>
            <option value="Frozen">Frozen</option>
            <option value="Pantry">Pantry</option>
            <option value="Drinks">Drinks</option>
            <option value="Snacks">Snacks</option>
            <option value="Personal Care">Personal Care</option>
            <option value="Household">Household</option>
            <option value="Other">Other</option>
          </select>
          <input id="priceInput" type="number" min="0" step="0.01" class="grocery-input" placeholder="Est. price" />
        </div>
        <div class="mt-4 grid gap-3 sm:grid-cols-[7rem_1fr]">
          <div class="grocery-mint-surface flex aspect-square items-center justify-center overflow-hidden rounded-2xl">
            <img id="productImagePreview" alt="" class="hidden h-full w-full object-cover" />
            <span id="productImageEmpty" class="px-2 text-center text-xs text-[#6B7280]">Product photo</span>
          </div>
          <div class="space-y-3">
            <div class="grid grid-cols-[1fr_auto] gap-2">
              <input id="imageUrlInput" type="url" class="grocery-input min-w-0" placeholder="Image URL" />
              <button id="lookupImageBtn" type="button" class="rounded-2xl border border-[#FBC02D] bg-[#FBC02D]/25 px-4 py-3 font-semibold text-[#1F2937] transition hover:bg-[#FBC02D]/35">Find</button>
            </div>
            <p id="productImageStatus" class="text-xs text-[#6B7280]">Looks up real product photos from Open Food Facts.</p>
          </div>
        </div>
        <textarea id="notesInput" rows="3" class="grocery-input mt-4 w-full" placeholder="Notes"></textarea>
        <div class="mt-6 flex justify-end gap-3">
          <button type="button" id="cancelAddBtn" class="grocery-secondary rounded-2xl px-4 py-2">Cancel</button>
          <button type="submit" id="addItemBtn" class="grocery-primary rounded-2xl px-4 py-2 font-semibold">Add Item</button>
        </div>
      </form>
    </div>
  </div>

  <div id="messageAlert" class="fixed left-1/2 top-4 z-50 hidden -translate-x-1/2 rounded-2xl px-5 py-3 text-sm font-semibold text-white shadow-lg"></div>
  <div id="ariaLive" class="sr-only" aria-live="polite"></div>
  <script type="module" src="./script.js"></script>
</body>
</html>
