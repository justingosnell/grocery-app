<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery List Creator</title>
    
    <!-- PWA disabled: removed manifest and theme-color -->
    <link rel="apple-touch-icon" href="/logo.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="secondary_final.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">

    <!-- PWA disabled: removed manifest and service worker registration -->
    <!-- <meta name="theme-color" content="#0ea5e9"> -->
    <!-- <link rel="manifest" href="/manifest.json"> -->
    <!-- Service worker registration removed -->

    <style>
        .bottom-nav {
            transform: translateY(0);
            transition: transform 0.3s ease-in-out;
        }
        .bottom-nav.up {
            transform: translateY(-var(--keyboard-height, 200px));
        }
        .modal-content.slide-up {
            transform: translateY(0);
            opacity: 1;
        }
        .modal-content.slide-down {
            transform: translateY(100%);
            opacity: 0;
        }
        .toast-container {
            bottom: 6rem; /* Position above the bottom nav */
            left: 50%;
            transform: translateX(-50%);
        }
        /* Single-row, horizontally scrollable emoji buttons */
        .emoji-suggestions .emoji-row {
            display: flex;
            flex-wrap: nowrap; /* keep on one line */
            overflow-x: auto;
            overflow-y: hidden;
            gap: 0.5rem;
            padding: 0.25rem 0;
            -webkit-overflow-scrolling: touch; /* momentum scrolling on iOS */
            scroll-snap-type: x proximity; /* optional: gentle snapping */
            /* Fade edge hint */
            -webkit-mask-image: linear-gradient(to right, transparent, black 16px, black calc(100% - 16px), transparent);
            mask-image: linear-gradient(to right, transparent, black 16px, black calc(100% - 16px), transparent);
            -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
        }
        .emoji-suggestions .emoji-btn {
            flex: 0 0 auto; /* prevent shrinking/wrapping */
            scroll-snap-align: start; /* align buttons to snap points */
        }
        /* Remove left/right fade when scrolled to the ends */
        .emoji-suggestions .emoji-row.at-start {
            -webkit-mask-image: linear-gradient(to right, black, black 16px, black calc(100% - 16px), transparent);
            mask-image: linear-gradient(to right, black, black 16px, black calc(100% - 16px), transparent);
        }
        .emoji-suggestions .emoji-row.at-end {
            -webkit-mask-image: linear-gradient(to right, transparent, black 16px, black calc(100% - 16px), black);
            mask-image: linear-gradient(to right, transparent, black 16px, black calc(100% - 16px), black);
        }
        .emoji-suggestions .emoji-row.at-start.at-end {
            -webkit-mask-image: none;
            mask-image: none;
        }
    </style>
</head>
<body class="p-4 bg-gray-100 dark:bg-gray-900 pb-20">

    <main class="container mx-auto p-4 md:p-8">
        <header class="p-4 pt-10 text-center">
    <div class="flex items-center justify-center space-x-4">
        <img src="logo.png" alt="Shopping Bag Logo" class="h-10 w-10">
        <h1 class="text-4xl sm:text-5xl font-extrabold text-blue-500">Shopping List</h1>
    </div>
</header>

        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 card p-6" role="region" aria-labelledby="current-list-heading">
                <div class="flex flex-col sm:flex-row gap-4 mb-4">
                    <div class="relative flex-grow">
                        <label for="listNameInput" class="sr-only">Supermarket Name</label>
                        <input type="text" id="listNameInput" class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-500 bg-surface pr-10" placeholder="e.g. Publix, Ingles - Enter list name" autocomplete="off" aria-autocomplete="list" aria-controls="autocompleteContainer" aria-label="Enter a name for your saved list">
                        <button type="button" id="clearListNameInput" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 hidden" tabindex="-1" aria-label="Clear input">
                            <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="11" cy="11" r="10" fill="currentColor" fill-opacity="0.15"/>
                                <path d="M8 8l6 6M14 8l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </button>
                        <div id="autocompleteContainer" class="absolute w-full mt-1 autocomplete-list shadow-lg hidden" role="listbox"></div>
                        <p id="nameWarning" class="text-sm text-red-500 mt-2 hidden" aria-live="polite">Please type at least three letters to see suggestions.</p>
                    </div>
                </div>

                <ul id="currentList" class="space-y-3" role="list">
                    <div id="currentListEmptyState" class="text-center py-10 opacity-70">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 text-blue-500 mx-auto mb-4" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z" clip-rule="evenodd" />
                        </svg>
                        <h3 class="text-xl font-bold mb-2">Your list is empty!</h3>
                        <p class="text-gray-600 dark:text-gray-400 mb-4">Add your first grocery item from the button below.</p>
                    </div>
                </ul>
                <div id="messageAlert" role="alert" class="mt-4 p-4 rounded-lg text-white font-semibold hidden"></div>

                <div id="clearListBtnContainer" class="flex justify-between items-center mt-6 hidden">
                    <button id="clearListBtn" class="btn bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg" aria-label="Save the current list">Save List</button>
                    <button type="button" id="clearListLink" class="btn bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2 px-4 rounded-lg">
                        Clear List
                    </button>
                </div>
            </div>
        </section>
    </main>

    <nav class="bottom-nav fixed bottom-0 left-0 right-0 z-50 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 shadow-lg">
        <div class="flex h-16 max-w-lg mx-auto">
            <button id="showSavedListsBtn" class="relative flex-1 flex flex-col items-center justify-center p-2 text-gray-500 dark:text-gray-400 hover:text-blue-500 dark:hover:text-blue-400 transition-colors duration-200" aria-label="View Saved Lists">
                <div class="relative">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                    <span id="savedListsBadge" class="hidden absolute -top-1 -right-2 min-w-[1.25rem] h-5 px-1 rounded-full bg-red-500 text-white text-[10px] leading-5 text-center font-bold">0</span>
                </div>
                <span class="text-xs">Lists</span>
            </button>
            <button id="addNewItemBtn" class="flex-1 flex flex-col items-center justify-center p-2 text-blue-500 dark:text-blue-400 font-semibold" aria-label="Add New Item">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                </svg>
                <span class="text-xs">Add Item</span>
            </button>
            <button id="accountNavBtn" class="flex-1 flex flex-col items-center justify-center p-2 text-gray-500 dark:text-gray-400 hover:text-blue-500 dark:hover:text-blue-400 transition-colors duration-200" aria-label="Account">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5.121 17.804A13.937 13.937 0 0112 15c2.5 0 4.847.655 6.879 1.804M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span id="accountNavLabel" class="text-xs">Login</span>
            </button>
        </div>
    </nav>

    <!-- Socket.IO client + API base config + app script -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        // Configure API base for frontend (hardcoded for Render)
        window.API_BASE = 'https://grocery-app-ypth.onrender.com';
    </script>
    <script src="./script.js"></script>
</body>
</html>
