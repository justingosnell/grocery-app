services:
  - type: web
    name: grocery-app
    env: node
    plan: free
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SQLITE_PATH
        value: /data/db.sqlite
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true